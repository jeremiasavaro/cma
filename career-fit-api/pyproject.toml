[project]
name = "career-fit-api"
version = "0.1.0"
description = "Career Fit Intelligence API - Analyze CV fit against market data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Validation & Settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2",
    # HTTP Client
    "httpx>=0.27",
    # Data processing
    "pandas>=2.2",
    "polars>=1.6",
    # ML
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "sentence-transformers>=3.0",
    # NLP
    "spacy>=3.7",
    # Utils
    "python-dotenv>=1.0",
    "python-json-logger>=2.0",
    "tenacity>=8.2",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
worker = [
    "apscheduler>=3.10",
    "httpx>=0.27",
    "tenacity>=8.2",
]
ml = [
    "shap>=0.44",
    "optuna>=4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "C4", "ARG", "PTH", "T20", "SIM", "RET"]
ignore = ["S101", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]